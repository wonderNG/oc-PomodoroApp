name: Deploy Vite Subfolder to GitHub Pages

on:
  push:
    branches: ["main"] # or master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Vite App from Subfolder
        run: |
          cd oc-Pomodoro
          npm ci
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: oc-Pomodoro/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
